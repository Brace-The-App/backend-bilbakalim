# Nginx WebSocket Proxy Konfigürasyonu
# Bu dosyayı Nginx site konfigürasyonunuza ekleyin

# Socket.IO WebSocket Proxy
location /socket.io/ {
    proxy_pass https://localhost:3001;  # Socket server HTTPS portu
    proxy_http_version 1.1;
    
    # WebSocket upgrade headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket timeout ayarları
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    
    # SSL verification (eğer self-signed certificate kullanıyorsanız)
    proxy_ssl_verify off;
}

# Socket webhooks endpoint
location /socket-webhooks/ {
    proxy_pass https://localhost:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

